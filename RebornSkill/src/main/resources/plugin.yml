name: RebornSkill
version: '${project.version}'
main: kr.reborn.skill.RebornSkill
api-version: '1.20'
folia-supported: true
authors: [ReincarnationWorld]
description: 스킬·전투·에너지·비급학습
depend: [RebornCore]
softdepend: [RebornStat]
load: POSTWORLD
commands:
  skill:
    description: 스킬 GUI 및 시전
    permission: rebornskill.use
  energy:
    description: 에너지 상태
    permission: rebornskill.use
  manual:
    description: 비급 - 발견·연구·도난·양도
    usage: /manual list|owned|info|discover|research|progress|steal|transfer
  school:
    description: 무공 학파 - 5종 (정파/사파/마교/황궁/은둔파)
    usage: /school join <SCHOOL> | list
permissions:
  rebornskill.use: { default: true }
  rebornskill.admin:
    default: op
    description: /skill learn, /manual discover 등 즉시 학습/획득 관리 권한
