name: RebornQuest
version: '${project.version}'
main: kr.reborn.quest.RebornQuest
api-version: '1.20'
folia-supported: true
authors: [ReincarnationWorld]
description: NPC·월드·발견·자기생성·세력 퀘스트
depend: [RebornCore]
softdepend: [RebornNPC, RebornStat, RebornEconomy, RebornWorldAI]
load: POSTWORLD
commands:
  quest:
    description: 퀘스트
    permission: rebornquest.use
  event:
    description: 이벤트 트리 시작 (관리/테스트 — 일반 진행은 NPC 통해)
    permission: rebornquest.admin
  eventchoice:
    description: 이벤트 선택지
    permission: rebornquest.use
permissions:
  rebornquest.use: { default: true }
  rebornquest.admin:
    default: op
    description: 이벤트 강제 트리거 등 관리 권한
