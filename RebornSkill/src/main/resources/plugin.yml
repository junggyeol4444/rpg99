name: RebornSkill
version: '${project.version}'
main: kr.reborn.skill.RebornSkill
api-version: '1.20'
folia-supported: true
authors: [ReincarnationWorld]
description: 스킬·전투·에너지·비급학습
depend: [RebornCore]
softdepend: [RebornStat]
load: POSTWORLD
commands:
  skill:
    description: 스킬 GUI 및 시전
    permission: rebornskill.use
  energy:
    description: 에너지 상태
    permission: rebornskill.use
  manual:
    description: 비급 - 발견·연구·도난·양도
    usage: /manual list|owned|info|discover|research|progress|steal|transfer
permissions:
  rebornskill.use: { default: true }
