name: RebornCore
version: '${project.version}'
main: kr.reborn.core.RebornCore
api-version: '1.20'
folia-supported: true
authors: [ReincarnationWorld]
description: 환생의 월드 코어 플러그인 (DB·스탯·경지·이벤트버스)
load: STARTUP
commands:
  reborncore:
    description: RebornCore 관리 명령어
    aliases: [rcore, rc]
    permission: reborncore.admin
  dashboard:
    description: 통합 대시보드 - 모든 플러그인 상태 한 화면
    aliases: [db, status]
  pastlife:
    description: 전생 회상 - 모든 전생 기록 + 잔존 효과
    aliases: [past, reincarnation]
  hidden:
    description: 6 히든 월드 발견 상태 + 해금 조건
    aliases: [hiddenworld]
  guide:
    description: 현재 세계의 시스템·명령어 안내
    aliases: [g, help2]
permissions:
  reborncore.admin:
    default: op
    description: 코어 관리 권한
