name: RebornDeath
version: '${project.version}'
main: kr.reborn.death.RebornDeath
api-version: '1.21'
folia-supported: true
authors: [ReincarnationWorld]
description: 사망·명계·윤회·범죄 시스템
depend: [RebornCore]
softdepend: [RebornStat, RebornSpawn, RebornEconomy, RebornClan, RebornCurse, RebornNPC]
load: POSTWORLD
commands:
  death:
    description: 사망 관련 GUI
    permission: reborndeath.use
  underworld:
    description: 명계 행동 (환혼/윤회/잔류)
    permission: reborndeath.use
  bounty:
    description: 현상수배 정보
    permission: reborndeath.use
  duel:
    description: 1v1 결투 - 명예 시스템
    usage: /duel challenge|accept|reject|honor|top
    permission: reborndeath.use
permissions:
  reborndeath.use: { default: true }
