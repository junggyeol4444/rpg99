name: RebornStat
version: '${project.version}'
main: kr.reborn.stat.RebornStat
api-version: '1.20'
folia-supported: true
authors: [ReincarnationWorld]
description: 스탯·경지·성장·미니게임
depend: [RebornCore]
softdepend: [RebornCurse, RebornNPC, RebornSkill, RebornEconomy]
load: POSTWORLD
commands:
  stats:
    description: 스탯 GUI
  tierup:
    description: 경지 돌파 시도
  meditate:
    description: 운기조식 (무협)
  answer:
    description: 깨달음 미니게임 답변
  fortune:
    description: 기연 목록·획득 확인
  transform:
    description: 요계 변신 (요기 100 소모, 30초)
  moonritual:
    description: 요계 보름달 의식 (요기 대량 누적)
  pray:
    description: 천계 신전 기도
    usage: /pray [npcId]
permissions:
  rebornstat.use:
    default: true
